# okay-cool.net: the static portfolio, served from Pi Black.
# It listens on loopback only. cloudflared (the Cloudflare Tunnel) is the one way in,
# so no firewall port is open for this site anywhere.
server {
    listen 127.0.0.1:8088;
    server_name okay-cool.net www.okay-cool.net;
    root /var/www/okay-cool.net;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/okay-cool.access.log;
    error_log  /var/log/nginx/okay-cool.error.log warn;

    # cloudflared connects from loopback; the visitor's address arrives in CF-Connecting-IP.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    if ($host = www.okay-cool.net) { return 301 https://okay-cool.net$request_uri; }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    error_page 404 /404.html;

    include /etc/nginx/snippets/okay-cool-headers.conf;

    location ~ /\. { deny all; }

    location = /status.json {
        include /etc/nginx/snippets/okay-cool-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    # code revalidates every time (cheap 304s), so a deploy never pairs new HTML with stale CSS/JS
    location ~* \.(?:css|js)$ {
        include /etc/nginx/snippets/okay-cool-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location ~* \.(?:webp|png|jpe?g|svg|ico|woff2|mp3|mp4)$ {
        include /etc/nginx/snippets/okay-cool-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }
    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/okay-cool-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
